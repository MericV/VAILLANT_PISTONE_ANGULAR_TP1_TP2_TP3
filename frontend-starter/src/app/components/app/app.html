<!--
  Ciel nocturne décoratif : fond noir, étoiles fixes qui scintillent et étoiles filantes.
  Tout est en CSS (aucune image ni script) ; chaque étoile filante reçoit sa position,
  son angle, sa durée et son décalage par des variables CSS, d'où un passage irrégulier.
-->
@if (!ownBackground()) {
  <div class="sky" aria-hidden="true">
    <span class="shooting" style="--x: 85%; --y: 8%;  --len: 1100px; --dur: 11s; --delay: 0s"></span>
    <span class="shooting" style="--x: 60%; --y: -5%; --len: 900px;  --dur: 14s; --delay: 3.5s"></span>
    <span class="shooting" style="--x: 105%; --y: 30%; --len: 1300px; --dur: 17s; --delay: 7s"></span>
    <span class="shooting" style="--x: 40%; --y: 2%;  --len: 800px;  --dur: 13s; --delay: 9.5s"></span>
    <span class="shooting" style="--x: 95%; --y: 55%; --len: 1000px; --dur: 19s; --delay: 12s"></span>
  </div>
}

<header #bar class="topbar" (pointermove)="glow($event, bar)">
  <!-- La bulle de verre glisse sous le lien survolé (ou focalisé), puis revient sur la page courante. -->
  <nav #nav aria-label="Navigation principale" (pointerover)="moveBubble($event.target)" (focusin)="moveBubble($event.target)" (pointerleave)="moveBubble(null)">
    <span class="bubble" aria-hidden="true" [class.on]="bubble()" [style.--x.px]="bubble()?.x" [style.--y.px]="bubble()?.y" [style.--w.px]="bubble()?.w" [style.--h.px]="bubble()?.h"></span>
    <a routerLink="/home" routerLinkActive="active" ariaCurrentWhenActive="page">Accueil</a>
    <!-- « Jouer » mène au salon du groupe (/groups/:id/live) ; « Groupes », à la liste des groupes. -->
    <a class="play" routerLink="/lobby" [class.active]="router.url.endsWith('/live')">Jouer</a>
    <a routerLink="/groups" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Groupes</a>
    <a routerLink="/tracks" routerLinkActive="active" ariaCurrentWhenActive="page">Backing tracks</a>
    <a routerLink="/leaderboard" routerLinkActive="active" ariaCurrentWhenActive="page">Classement</a>
    <a routerLink="/shop" routerLinkActive="active" ariaCurrentWhenActive="page">Boutique</a>
    <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">Profil</a>
    @if (auth.token()) {
      <button type="button" class="logout" (click)="logout()">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
        Déconnexion
      </button>
    } @else {
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Connexion</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
